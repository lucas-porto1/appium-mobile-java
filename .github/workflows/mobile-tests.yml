name: Mobile Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      report-artifact-id: ${{ steps.pages-artifact.outputs.artifact_id }}
    env:
      APPIUM_SERVER_URL: http://127.0.0.1:4723
      ANDROID_DEVICE_NAME: GitHub Actions Android Emulator
      ANDROID_UDID: emulator-5554
      APP_PATH: apps/ApiDemos-debug.apk
      ANDROID_APP_PACKAGE: io.appium.android.apis
      ANDROID_APP_ACTIVITY: io.appium.android.apis.ApiDemos
      ELEMENT_TIMEOUT_SECONDS: 20
      NEW_COMMAND_TIMEOUT_SECONDS: 120
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Maven Wrapper
        run: chmod +x mvnw
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Appium toolchain
        run: npm ci
      - name: Download demo application
        run: npm run setup:app
      - name: Check formatting and compilation
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests verify
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -no-metrics -camera-back none
          script: bash scripts/run-mobile-tests-ci.sh
      - name: Generate HTML test report
        if: always()
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests surefire-report:report-only
      - name: Upload failure evidence and raw logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-test-failure-evidence
          path: |
            target/surefire-reports
            target/failure-artifacts
            appium.log
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare HTML report for GitHub Pages
        if: always() && github.event_name != 'pull_request' && hashFiles('target/reports/mobile-test-report.html') != ''
        run: |
          mkdir -p target/pages
          cp -R target/reports/. target/pages/
          cp target/pages/mobile-test-report.html target/pages/index.html
      - name: Upload HTML report for GitHub Pages
        id: pages-artifact
        if: always() && github.event_name != 'pull_request' && hashFiles('target/pages/index.html') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages

  publish-report:
    name: Publish HTML report
    needs: test
    if: always() && github.event_name != 'pull_request' && needs.test.outputs.report-artifact-id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Add report link to the job summary
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo '## Mobile test report' >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the latest HTML report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
