version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: semiannually
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: semiannually
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: semiannually
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
